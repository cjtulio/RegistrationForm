<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <aside class="side-panel">
    <h2>Mandaluyong College of Science and Technology</h2>
    <p class="subtitle">Registration Form</p>
    <p class="desc">Fill out the form to complete your enrollment for the upcoming school year.</p>
    <ul class="field-list">
      <li>First Name <span class="req">*</span></li>
      <li>Last Name <span class="req">*</span></li>
      <li>Contact</li>
      <li>Email Address <span class="req">*</span></li>
      <li>Password <span class="req">*</span></li>
      <li>Gender</li>
      <li>Hobbies</li>
      <li>Country</li>
      <li>Message</li>
    </ul>
    <p class="note">* Required fields</p>
  </aside>

  <main class="form-panel">
    <form>
      <div class="grid-3col">

        <div class="field">
          <label for="firstName">First Name<span class="req">*</span></label>
          <input type="text" id="firstName" name="firstName" placeholder="Carl Joshua" required>
        </div>

        <div class="field">
          <label for="lastName">Last Name<span class="req">*</span></label>
          <input type="text" id="lastName" name="lastName" placeholder="Tulio" required>
        </div>

        <div class="field">
          <label for="contact">Contact Number</label>
          <input type="tel" id="contact" name="contact" placeholder="09XX XXX XXXX">
        </div>

        <div class="field">
          <label for="email">Email Address<span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password<span class="req">*</span></label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

<div class="field">
  <label for="country">Barangay</label>
  <input type="text" id="country" name="Barangay" list="country-list" placeholder="Start typing to search..." autocomplete="off">
  
  <datalist id="country-list">
    <option value="Addition Hills">
<option value="Bagong Silang">
<option value="Barangka Drive">
<option value="Barangka Ibaba">
<option value="Barangka Ilaya">
<option value="Barangka Itaas">
<option value="Buayang Bato">
<option value="Burol">
<option value="Daang Bakal">
<option value="Hagdang Bato Itaas">
<option value="Hagdang Bato Libis">
<option value="Harapin Ang Bukas">
<option value="Highway Hills">
<option value="Hulo">
<option value="Mabini-J. Rizal">
<option value="Malamig">
<option value="Mauway">
<option value="Namayan">
<option value="New Zaniga">
<option value="Old Zaniga">
<option value="Pag-asa">
<option value="Plainview">
<option value="Pleasant Hills">
<option value="Poblacion">
<option value="San Jose">
<option value="Vergara">
<option value="Wack-Wack Greenhills">
  </datalist>
</div>
      <div class="grid-2col">
        <div class="field">
          <label>Gender</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
          </div>
        </div>

        <div class="field">
          <label>Hobbies</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
            <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
            <label><input type="checkbox" name="hobbies" value="music"> Music</label>
            <label><input type="checkbox" name="hobbies" value="gaming"> Gaming</label>
            <label><input type="checkbox" name="hobbies" value="travel"> Travel</label>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write a short message..."></textarea>
      </div>

      <div class="button-row">
        <button type="submit" class="btn-submit">Submit</button>
        <button type="reset" class="btn-reset">Reset</button>
      </div>
    </form>
  </main>

</div>

</body>
</html>
