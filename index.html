<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Laboratory Exercise 3 - Registration Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
  <div class="form-header">
    <h1>LABORATORY EXERCISE 3</h1>
    <p>Registration Form</p>
  </div>

  <form>
    <div class="two-col">
      <div class="field">
        <label for="firstName">First Name<span class="required">*</span></label>
        <input type="text" id="firstName" name="firstName" placeholder="Juan" required>
      </div>
      <div class="field">
        <label for="lastName">Last Name<span class="required">*</span></label>
        <input type="text" id="lastName" name="lastName" placeholder="Dela Cruz" required>
      </div>
    </div>

    <div class="field">
      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" name="contact" placeholder="09XX XXX XXXX">
    </div>

    <div class="field">
      <label for="email">Email Address<span class="required">*</span></label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label for="password">Password<span class="required">*</span></label>
      <input type="password" id="password" name="password" placeholder="Enter password" required>
    </div>

    <div class="field">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </div>
    </div>

    <div class="field">
      <label>Hobbies</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
        <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
        <label><input type="checkbox" name="hobbies" value="music"> Music</label>
        <label><input type="checkbox" name="hobbies" value="gaming"> Gaming</label>
        <label><input type="checkbox" name="hobbies" value="travel"> Travel</label>
      </div>
    </div>

    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Select a country</option>
        <option value="ph">Philippines</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="jp">Japan</option>
        <option value="au">Australia</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write a short message..."></textarea>
    </div>

    <div class="button-row">
      <button type="submit" class="btn-submit">Submit</button>
      <button type="reset" class="btn-reset">Reset</button>
    </div>

    <p class="note">* Required fields</p>
  </form>
</div>

</body>
</html>
