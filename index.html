<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form | Laboratory Exercise 3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

  <div class="card-header">
    <p class="eyebrow">LABORATORY EXERCISE 3</p>
    <h1>Registration Form</h1>
    <p class="subtitle">Please complete the fields below. Fields marked with an asterisk (*) are required.</p>
  </div>

  <form class="card-body">

    <h2 class="section-title">Personal Details</h2>

    <div class="row-2">
      <div class="field">
        <label for="firstName">First Name<span class="req">*</span></label>
        <input type="text" id="firstName" name="firstName" placeholder="Juan" required>
      </div>
      <div class="field">
        <label for="lastName">Last Name<span class="req">*</span></label>
        <input type="text" id="lastName" name="lastName" placeholder="Dela Cruz" required>
      </div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="contact">Contact Number</label>
        <input type="tel" id="contact" name="contact" placeholder="09XX XXX XXXX">
      </div>
      <div class="field">
        <label for="email">Email Address<span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="juan.delacruz@email.com" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password<span class="req">*</span></label>
      <input type="password" id="password" name="password" required>
      <p class="hint">At least 8 characters.</p>
    </div>

    <h2 class="section-title">About You</h2>

    <div class="field">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="neutral"> Neutral</label>
      </div>
    </div>

    <div class="field">
      <label>Hobbies</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="hobbies" value="running"> Running</label>
        <label><input type="checkbox" name="hobbies" value="movies"> Watching Movies</label>
        <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
        <label><input type="checkbox" name="hobbies" value="music"> Music</label>
        <label><input type="checkbox" name="hobbies" value="games"> Online Games</label>
      </div>
    </div>

    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Select your country</option>
        <option value="ph">Philippines</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="jp">Japan</option>
        <option value="au">Australia</option>
        <option value="ca">Canada</option>
        <option value="sg">Singapore</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Anything else you'd like us to know?"></textarea>
    </div>

    <div class="button-row">
      <button type="submit" class="btn-submit">Submit</button>
      <button type="reset" class="btn-reset">Reset</button>
    </div>

    <p class="note">* Required fields</p>

  </form>

</div>

</body>
</html>
